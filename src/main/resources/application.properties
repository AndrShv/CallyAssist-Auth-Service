# --- Database ---
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.main.allow-bean-definition-overriding=true
spring.r2dbc.enabled=false
spring.jpa.properties.hibernate.format_sql=false


management.endpoints.web.exposure.include=health,info,prometheus


# --- Server ---
server.port=${SERVER_PORT}

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS}
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT}
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}
auth.queue.name=${AUTH_QUEUE_NAME}

# --- SMTP ---
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.messages.fallback-to-system-locale=false
spring.messages.encoding=UTF-8

# --- Google OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-name=Google
app.oauth2.redirect-uri=com.andrshv.cally://oauth
spring.security.oauth2.client.registration.google.redirect-uri=https://knox-exopoditic-azalea.ngrok-free.dev/login/oauth2/code/google

# Настройки для ngrok и Stateless режима
server.use-forward-headers=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
spring.session.store-type=none

# --- Resilience4j ---
resilience4j.circuitbreaker.instances.emailService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.emailService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.emailService.waitDurationInOpenState=10s
resilience4j.retry.instances.emailService.maxAttempts=3
resilience4j.retry.instances.emailService.waitDuration=1s