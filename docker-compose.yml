
networks:
  auth-net:
    driver: bridge
  monitoring-net:
    driver: bridge

services:

  mysql:
    image: mysql:8.0
    container_name: auth-cally-mobile-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1111
      MYSQL_DATABASE: authservice
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - auth-net


  prometheus:
      image: prom/prometheus
      container_name: monitoring-prometheus
      ports:
        - "9090:9090"
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      networks:
        - monitoring-net

  grafana:
      image: grafana/grafana
      container_name: monitoring-grafana
      ports:
        - "3000:3000"
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus
      networks:
        - monitoring-net
volumes:
  mysql_data:
  grafana_data:
