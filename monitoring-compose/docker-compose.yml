
networks:
  monitoring-net:
    driver: bridge

services:

  prometheus:
    image: prom/prometheus
    container_name: monitoring-prometheus
    ports:
       - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
       - monitoring-net

  grafana:
    image: grafana/grafana
    container_name: monitoring-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring-net

volumes:
  grafana_data: